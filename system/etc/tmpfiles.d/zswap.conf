# zswap in front of the disk swapfile instead of zram: a compressed cache that
# writes its coldest pages back to disk, so the RAM it takes holds the warm
# swap, not whatever was swapped out first. zram is masked by apply.sh.
w! /sys/module/zswap/parameters/enabled - - - - Y
w! /sys/module/zswap/parameters/max_pool_percent - - - - 25
