# Keep gnome-shell, Xwayland, PipeWire and the session daemons out of reclaim
# while apps can still give memory back. A compositor paged out to swap stalls
# every frame once the system starts thrashing. 3G covers the shell's GPU
# buffers too; the floor only takes effect with system/ applied, since
# protection has to be granted by every parent cgroup.
[Slice]
MemoryLow=3G
